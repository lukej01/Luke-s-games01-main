<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RetroStash — Play Classic Games Free</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:       #2563eb;
  --blue-dark:  #1d4ed8;
  --blue-light: #eff6ff;
  --blue-mid:   #bfdbfe;
  --text:       #111827;
  --text-2:     #374151;
  --text-3:     #6b7280;
  --border:     #e5e7eb;
  --bg:         #f9fafb;
  --white:      #ffffff;
  --radius:     12px;
  --shadow-sm:  0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow:     0 4px 16px rgba(0,0,0,.08);
  --shadow-lg:  0 8px 32px rgba(0,0,0,.12);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
.header{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;box-shadow:var(--shadow-sm)}
.header-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0}
.logo-mark{width:34px;height:34px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:18px;height:18px;fill:white}
.logo-name{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700;color:var(--text);letter-spacing:-.3px}
.logo-name span{color:var(--blue)}
.search-wrap{flex:1;max-width:400px;position:relative}
.search-wrap input{width:100%;padding:9px 14px 9px 38px;border:1.5px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:.875rem;color:var(--text);background:var(--bg);outline:none;transition:.15s}
.search-wrap input:focus{border-color:var(--blue);background:var(--white);box-shadow:0 0 0 3px #dbeafe}
.search-wrap input::placeholder{color:var(--text-3)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.header-end{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn-admin{padding:7px 14px;border:1.5px solid var(--border);border-radius:7px;background:var(--white);color:var(--text-2);font-family:'Inter',sans-serif;font-size:.8rem;font-weight:500;cursor:pointer;text-decoration:none;transition:.15s;white-space:nowrap}
.btn-admin:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-light)}
.game-count{font-size:.8rem;color:var(--text-3);font-weight:500;white-space:nowrap}

/* ── FILTERS ── */
.filters-bar{background:var(--white);border-bottom:1px solid var(--border);padding:12px 24px}
.filters-inner{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filter-label{font-size:.75rem;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-right:4px}
.chip{padding:5px 13px;border-radius:99px;border:1.5px solid var(--border);background:var(--white);color:var(--text-2);font-size:.8rem;font-weight:500;cursor:pointer;transition:.15s;user-select:none;white-space:nowrap}
.chip:hover{border-color:#93c5fd;color:var(--blue);background:var(--blue-light)}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--white)}

/* ── MAIN ── */
main{max-width:1200px;margin:0 auto;padding:28px 24px 64px}
.section-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.section-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;color:var(--text)}
.results-text{font-size:.8rem;color:var(--text-3)}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.18s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#bfdbfe}
.card-img-wrap{overflow:hidden;aspect-ratio:3/4;background:var(--blue-light);position:relative}
.card-img{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}
.card:hover .card-img{transform:scale(1.04)}
.card-fallback{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--blue);font-size:.8rem;font-weight:600;text-align:center;padding:12px;position:absolute;top:0;left:0}
.card-fallback-icon{font-size:2rem}
.play-badge{position:absolute;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;opacity:0;transition:.18s}
.play-badge svg{width:40px;height:40px;fill:white;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.card:hover .play-badge{opacity:1}
.card-body{padding:12px 12px 10px}
.card-title{font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:600;color:var(--text);margin-bottom:8px;line-height:1.3}
.card-footer{display:flex;align-items:center;justify-content:space-between}
.badge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.2px;text-transform:uppercase}
.b-ps1{background:#e0e7ff;color:#4338ca}
.b-n64{background:#dcfce7;color:#15803d}
.b-nds{background:#fef3c7;color:#b45309}
.b-snes{background:#fce7f3;color:#be185d}
.b-nes{background:#f3e8ff;color:#7c3aed}
.b-sega{background:#e0f2fe;color:#0369a1}
.b-other{background:#f3f4f6;color:#374151}

/* ── EMPTY ── */
.empty{text-align:center;padding:80px 20px;display:none}
.empty.show{display:block}
.empty-icon{font-size:2.5rem;margin-bottom:12px}
.empty h3{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;color:var(--text);margin-bottom:6px}
.empty p{font-size:.875rem;color:var(--text-3)}

/* ── OVERLAY ── */
.overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.88);display:none;flex-direction:column}
.overlay.open{display:flex}
.overlay-bar{height:50px;background:#0f172a;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.07)}
.overlay-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.95rem;color:white;display:flex;align-items:center;gap:8px}
.overlay-plat{font-size:.72rem;font-weight:500;color:rgba(255,255,255,.4);font-family:'Inter',sans-serif}
.overlay-x{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.8);width:32px;height:32px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:.15s}
.overlay-x:hover{background:rgba(255,255,255,.15);color:white}
.overlay-body{flex:1;position:relative}
.overlay-body iframe{width:100%;height:100%;border:none;display:block}
.overlay-loader{position:absolute;inset:0;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:rgba(255,255,255,.6);font-size:.875rem}
.spin{width:36px;height:36px;border:2.5px solid rgba(255,255,255,.1);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── FOOTER ── */
footer{border-top:1px solid var(--border);background:var(--white);padding:20px 24px;text-align:center;font-size:.8rem;color:var(--text-3)}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .header-inner{padding:0 14px;gap:10px}
  .filters-bar{padding:10px 14px}
  main{padding:20px 14px 48px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .game-count{display:none}
}

// ─── BUILD GAME HTML ─────────────────────────────────────────────────────────
// ALL games now use fetch-first → blob URL approach for reliability.
// This fixes the black screen on direct-type games on GitHub Pages.
function buildGameHtml(g) {
  const loader = g.loaderPath || (g.pathtodata.replace(/\/$/, '') + '/loader.js');
  const biosLine = g.bios ? `EJS_biosUrl = ${JSON.stringify(g.bios)};` : '';
  const vsyncOpts = g.vsync ? `EJS_defaultOptions = {vsync:"disabled"};` : '';

  // For merge-type (multi-part CHD/ROM)
  if (g.type === 'merge') {
    return `<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
body,html{margin:0;padding:0;display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif}
#gc{text-align:center;width:100%;height:100%}
#prog{font-size:16px;margin-top:20px;padding:10px 20px;background:rgba(255,255,255,.08);border-radius:8px;display:inline-block}
#errMsg{display:none;color:#f87171;margin-top:20px;padding:0 20px;max-width:400px}
</style></head><body>
<div id="gc">
<div id="game"></div>
<div id="prog">Loading: 0 / 0</div>
<div style="margin-top:8px;font-size:13px;color:rgba(255,255,255,.4)">First-time load may take a moment…</div>
<div id="errMsg"></div>
</div>
<script>
function mergeFiles(parts,cb){
  return new Promise((res,rej)=>{
    var bufs=[];
    function next(i){
      if(i>=parts.length){res(URL.createObjectURL(new Blob(bufs)));return;}
      fetch(parts[i]).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.arrayBuffer();})
      .then(d=>{bufs.push(d);cb(i+1);next(i+1);}).catch(rej);
    }
    next(0);
  });
}
function getParts(url,s,e,pad){
  var parts=[];
  for(var i=s;i<=e;i++){
    var p=pad?String(i).padStart(String(e).length,"0"):String(i);
    parts.push(url+".part"+p);
  }
  return parts;
}
var parts=getParts(${JSON.stringify(g.url)},${g.min},${g.max},${g.pad?'true':'false'});
var total=parts.length;
var prog=document.getElementById("prog");
mergeFiles(parts,function(n){if(prog)prog.textContent="Loading: "+n+" / "+total;})
.then(function(gameUrl){
  if(prog)prog.remove();
  document.querySelector("[style*='First-time']") && document.querySelector("[style*='First-time']").remove();
  EJS_player="#game";
  EJS_core=${JSON.stringify(g.core)};
  EJS_gameName=${JSON.stringify(g.name||g.title)};
  EJS_color="#2563eb";
  EJS_startOnLoaded=true;
  EJS_pathtodata=${JSON.stringify(g.pathtodata)};
  EJS_gameUrl=gameUrl;
  ${biosLine}
  ${vsyncOpts}
  var s=document.createElement("script");s.src=${JSON.stringify(loader)};document.body.appendChild(s);
}).catch(function(err){
  console.error(err);
  if(prog)prog.remove();
  var e=document.getElementById("errMsg");
  e.textContent="Error loading game — check your connection and refresh.";
  e.style.display="block";
});
<\/script></body></html>`;
  }

  // For direct-type (single ROM file) — fetch first then pass blob URL to emulator
  return `<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
body,html{margin:0;padding:0;display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif}
#gc{text-align:center;width:100%;height:100%}
#prog{font-size:16px;margin-top:20px;padding:10px 20px;background:rgba(255,255,255,.08);border-radius:8px;display:inline-block}
#errMsg{display:none;color:#f87171;margin-top:20px;padding:0 20px;max-width:400px;font-size:14px;line-height:1.5}
</style></head><body>
<div id="gc">
<div id="game"></div>
<div id="prog">Fetching game…</div>
<div style="margin-top:8px;font-size:13px;color:rgba(255,255,255,.4)">First-time load may take a moment…</div>
<div id="errMsg"></div>
</div>
<script>
var prog=document.getElementById("prog");
var errDiv=document.getElementById("errMsg");
function showErr(msg){
  if(prog)prog.remove();
  errDiv.textContent=msg;
  errDiv.style.display="block";
}
fetch(${JSON.stringify(g.gameUrl)})
  .then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status+" — could not download ROM");
    var total=parseInt(r.headers.get("content-length")||"0");
    if(!total) return r.arrayBuffer();
    var reader=r.body.getReader();
    var received=0;
    var chunks=[];
    function read(){
      return reader.read().then(function(x){
        if(x.done){
          var blob=new Blob(chunks);
          return blob.arrayBuffer();
        }
        chunks.push(x.value);
        received+=x.value.length;
        if(prog) prog.textContent="Loading: "+Math.round(received/total*100)+"%";
        return read();
      });
    }
    return read();
  })
  .then(function(buf){
    var gameUrl=URL.createObjectURL(new Blob([buf]));
    if(prog)prog.remove();
    document.querySelector("[style*='First-time']") && document.querySelector("[style*='First-time']").remove();
    EJS_player="#game";
    EJS_core=${JSON.stringify(g.core)};
    EJS_color="#2563eb";
    EJS_startOnLoaded=true;
    EJS_pathtodata=${JSON.stringify(g.pathtodata)};
    EJS_gameUrl=gameUrl;
    ${biosLine}
    ${vsyncOpts}
    var s=document.createElement("script");
    s.onerror=function(){showErr("Failed to load emulator. Check your connection.");};
    s.src=${JSON.stringify(loader)};
    document.body.appendChild(s);
  })
  .catch(function(err){
    console.error(err);
    showErr("Could not load game: "+err.message+". The ROM file may be unavailable — try another game.");
  });
<\/script></body></html>`;
}

// ─── STATE ───────────────────────────────────────────────────────────────────// ─── STATE ───────────────────────────────────────────────────────────────────
let filter = 'all', query = '';
function getDeleted(){ return JSON.parse(localStorage.getItem('pv_deleted')||'[]'); }
function getHidden(){  return JSON.parse(localStorage.getItem('pv_hidden')||'[]'); }
function getEdits(){   return JSON.parse(localStorage.getItem('pv_edits')||'{}'); }
function getAdminGames(){ return JSON.parse(localStorage.getItem('pv_admin_games')||'[]'); }

function getAllGames(){
  const del=getDeleted(), hid=getHidden(), edits=getEdits();
  const base = GAMES.filter(g=>!del.includes(g.id)).map(g=>{
    const e=edits[g.id]; return e?{...g,...e}:{...g};
  }).filter(g=>!hid.includes(g.id));
  const admin = getAdminGames().filter(g=>!hid.includes(g.id));
  return [...base,...admin];
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render(){
  const all = getAllGames();
  const q = query.toLowerCase().trim();
  const list = all.filter(g=>{
    const mp = filter==='all' || g.platform===filter;
    const ms = !q || g.title.toLowerCase().includes(q) || g.platform.toLowerCase().includes(q);
    return mp && ms;
  });

  document.getElementById('gameCount').textContent = all.length+' games';
  document.getElementById('resultsText').textContent =
    list.length===all.length ? all.length+' games' : list.length+' of '+all.length+' games';

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';

  if(!list.length){ empty.classList.add('show'); return; }
  empty.classList.remove('show');

  list.forEach(g=>{
    const platLabel = PLAT_LABEL[g.platform]||g.platform;
    const bc = BADGE[g.platform]||'b-other';
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div class="card-img-wrap">
        <img class="card-img" src="${esc(g.cover)}" alt="${esc(g.title)}"
          referrerpolicy="no-referrer" loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="card-fallback" style="display:none">
          <span class="card-fallback-icon">🎮</span>
          <span>${esc(g.title)}</span>
        </div>
        <div class="play-badge">
          <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </div>
      </div>
      <div class="card-body">
        <div class="card-title">${esc(g.title)}</div>
        <div class="card-footer">
          <span class="badge ${bc}">${esc(platLabel)}</span>
        </div>
      </div>`;
    div.addEventListener('click',()=>playGame(g));
    grid.appendChild(div);
  });
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ─── PLAY GAME ───────────────────────────────────────────────────────────────
let blobUrl = null;

function playGame(g){
  const overlay = document.getElementById('overlay');
  const frame   = document.getElementById('gameFrame');
  const loader  = document.getElementById('ovLoader');
  const title   = document.getElementById('ovTitle');
  const platLabel = PLAT_LABEL[g.platform]||g.platform;

  title.innerHTML = esc(g.title)+' <span class="overlay-plat">'+esc(platLabel)+'</span>';

  // Show overlay + loading state
  loader.style.display = 'flex';
  frame.style.opacity = '0';
  frame.src = 'about:blank';
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  // If game has embedded HTML (built-in), build blob; if admin-added with file path, use file path
  let htmlStr;
  if (g.type === 'merge' || g.type === 'direct') {
    htmlStr = buildGameHtml(g);
  } else if (g.file) {
    // Admin-added game pointing to a file path — load directly
    frame.onload = ()=>{ loader.style.display='none'; frame.style.opacity='1'; };
    frame.src = g.file;
    return;
  }

  // Revoke previous blob
  if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }

  try {
    blobUrl = URL.createObjectURL(new Blob([htmlStr], {type:'text/html'}));
    frame.onload = ()=>{ loader.style.display='none'; frame.style.opacity='1'; };
    frame.src = blobUrl;
  } catch(e) {
    console.error(e);
    loader.innerHTML = '<span style="color:#f87171">Failed to load game. Check your connection.</span>';
  }
}

function closeGame(){
  const overlay = document.getElementById('overlay');
  const frame   = document.getElementById('gameFrame');
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(()=>{
    frame.src = 'about:blank';
    if(blobUrl){ URL.revokeObjectURL(blobUrl); blobUrl=null; }
  }, 200);
}

// ─── EVENTS ──────────────────────────────────────────────────────────────────
document.getElementById('ovClose').addEventListener('click', closeGame);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeGame(); });

document.getElementById('searchInput').addEventListener('input', e=>{
  query = e.target.value; render();
});

document.querySelectorAll('.chip').forEach(c=>{
  c.addEventListener('click',()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    filter = c.dataset.p;
    render();
  });
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
render();
</script>
