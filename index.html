<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameStash — Play Classic Games Free</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#2563eb;--blue-d:#1d4ed8;--blue-l:#eff6ff;--blue-m:#bfdbfe;
  --text:#111827;--text2:#374151;--text3:#6b7280;
  --border:#e5e7eb;--bg:#f9fafb;--white:#fff;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow-lg:0 12px 40px rgba(0,0,0,.15);
  --radius:12px;
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

/* HEADER */
.header{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.header-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0}
.logo-mark{width:34px;height:34px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:18px;height:18px;fill:white}
.logo-name{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700;color:var(--text);letter-spacing:-.3px}
.logo-name span{color:var(--blue)}
.search-wrap{flex:1;max-width:400px;position:relative}
.search-wrap input{width:100%;padding:9px 14px 9px 38px;border:1.5px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:.875rem;color:var(--text);background:var(--bg);outline:none;transition:.15s}
.search-wrap input:focus{border-color:var(--blue);background:var(--white);box-shadow:0 0 0 3px #dbeafe}
.search-wrap input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.header-end{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn-admin{padding:7px 14px;border:1.5px solid var(--border);border-radius:7px;background:var(--white);color:var(--text2);font-family:'Inter',sans-serif;font-size:.8rem;font-weight:500;cursor:pointer;text-decoration:none;transition:.15s}
.btn-admin:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.game-count{font-size:.8rem;color:var(--text3);font-weight:500;white-space:nowrap}

/* FILTERS */
.filters-bar{background:var(--white);border-bottom:1px solid var(--border);padding:12px 24px}
.filters-inner{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filter-label{font-size:.75rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-right:4px}
.chip{padding:5px 13px;border-radius:99px;border:1.5px solid var(--border);background:var(--white);color:var(--text2);font-size:.8rem;font-weight:500;cursor:pointer;transition:.15s;user-select:none}
.chip:hover{border-color:#93c5fd;color:var(--blue);background:var(--blue-l)}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--white)}

/* MAIN */
main{max-width:1200px;margin:0 auto;padding:28px 24px 64px}
.section-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.section-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;color:var(--text)}
.results-text{font-size:.8rem;color:var(--text3)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:16px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.18s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--blue-m)}
.card-img-wrap{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--blue-l)}
.card-img{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}
.card:hover .card-img{transform:scale(1.05)}
.card-fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--blue);font-size:.8rem;font-weight:600;text-align:center;padding:12px}
.card-play{position:absolute;inset:0;background:rgba(17,24,39,.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:.18s}
.card-play svg{width:44px;height:44px;fill:white;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.card:hover .card-play{opacity:1}
.card-body{padding:10px 11px 10px}
.card-title{font-family:'Space Grotesk',sans-serif;font-size:.83rem;font-weight:700;color:var(--text);margin-bottom:7px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-footer{display:flex;align-items:center}
.badge{font-size:.67rem;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.2px;text-transform:uppercase}
.b-ps1{background:#e0e7ff;color:#4338ca}
.b-n64{background:#dcfce7;color:#15803d}
.b-nds{background:#fef3c7;color:#b45309}
.b-snes{background:#fce7f3;color:#be185d}
.b-nes{background:#f3e8ff;color:#7c3aed}
.b-sega{background:#e0f2fe;color:#0369a1}
.b-gba{background:#e0f2fe;color:#0369a1}
.b-other{background:#f3f4f6;color:#374151}

/* EMPTY */
.empty{text-align:center;padding:80px 20px;display:none}
.empty.show{display:block}
.empty-icon{font-size:2.5rem;margin-bottom:12px}
.empty h3{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;color:var(--text);margin-bottom:6px}
.empty p{font-size:.875rem;color:var(--text3)}

/* MODAL */
.modal-bg{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--white);border-radius:18px;width:100%;max-width:920px;height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.35)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-title-wrap{display:flex;align-items:center;gap:10px}
.modal-title{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:700;color:var(--text)}
.modal-actions{display:flex;align-items:center;gap:8px}
.btn-x{width:32px;height:32px;border-radius:7px;border:1.5px solid var(--border);background:var(--white);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.95rem;transition:.15s}
.btn-x:hover{background:var(--bg)}

/* Game frame */
.modal-game{position:relative;background:#000;flex-shrink:0}
.modal-game iframe{width:100%;height:360px;border:none;display:block;background:#000;}
.game-loader{position:absolute;inset:0;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:rgba(255,255,255,.65);font-size:.875rem;z-index:2}
.spin{width:32px;height:32px;border:2.5px solid rgba(255,255,255,.1);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Info scroll area */
.modal-below{flex:1;min-height:0;overflow-y:scroll;-webkit-overflow-scrolling:touch}
.modal-info{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--border)}
.info-col{padding:18px 20px}
.info-col:first-child{border-right:1px solid var(--border)}
.info-label{font-family:'Space Grotesk',sans-serif;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:10px}
.game-desc{font-size:.855rem;color:var(--text2);line-height:1.65}

/* ── CONTROLS DROPDOWN BUTTON ── */
.controls-dropdown {
  position: relative;
  display: inline-block;
  margin-top: 5px;
}
.controls-btn {
  background: var(--blue);
  color: white;
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.controls-btn:hover { background: var(--blue-d); }
.controls-content {
  display: none;
  position: absolute;
  bottom: 100%; /* drop UP */
  left: 0;
  margin-bottom: 8px;
  background-color: var(--white);
  min-width: 240px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  border-radius: 12px;
  padding: 16px;
  z-index: 100;
  border: 1px solid var(--border);
}
.controls-content.show { display: block; }

.ctrl-list{display:flex;flex-direction:column;gap:0}
.ctrl-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f3f4f6}
.ctrl-row:last-child{border-bottom:none}
.ctrl-action{font-size:.75rem;color:var(--text3)}
.ctrl-key{font-size:.72rem;font-weight:600;color:var(--text);background:var(--bg);border:1.5px solid var(--border);border-radius:4px;padding:1px 7px;font-family:monospace;white-space:nowrap}

/* FOOTER */
footer{border-top:1px solid var(--border);background:var(--white);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;font-size:.8rem;color:var(--text3)}
.footer-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--text);font-size:.85rem}
.footer-brand span{color:var(--blue)}

/* RESPONSIVE */
@media(max-width:680px){
  .header-inner{padding:0 14px;gap:10px}
  .filters-bar{padding:10px 14px}
  main{padding:20px 14px 48px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .game-count{display:none}
  .modal{height:96vh;border-radius:12px}
  .modal-game iframe{height:240px}
  .modal-info{grid-template-columns:1fr}
  .info-col:first-child{border-right:none;border-bottom:1px solid var(--border)}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a class="logo" href="#">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24"><path d="M21 6H3a2 2 0 00-2 2v8a2 2 0 002 2h18a2 2 0 002-2V8a2 2 0 00-2-2zM8 13H6v2H4v-2H2v-2h2V9h2v2h2v2zm4.5 1.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S15.67 8.5 16.5 8.5 18 9.17 18 10s-.67 1.5-1.5 1.5z"/></svg>
      </div>
      <span class="logo-name">Game<span>Stash</span></span>
    </a>
    <div class="search-wrap">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="Search games…" autocomplete="off" spellcheck="false">
    </div>
    <div class="header-end">
      <span class="game-count" id="gameCount"></span>
      <a class="btn-admin" href="admin.html">Admin</a>
    </div>
  </div>
</header>

<div class="filters-bar">
  <div class="filters-inner">
    <span class="filter-label">Platform</span>
    <button class="chip on" data-p="all">All</button>
    <button class="chip" data-p="N64">N64</button>
    <button class="chip" data-p="PS1">PS1</button>
    <button class="chip" data-p="NDS">DS</button>
    <button class="chip" data-p="SNES">SNES</button>
    <button class="chip" data-p="NES">NES</button>
    <button class="chip" data-p="SEGA">Sega</button>
    <button class="chip" data-p="GBA">GBA</button>
  </div>
</div>

<main>
  <div class="section-row">
    <span class="section-title">Library</span>
    <span class="results-text" id="resultsText"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">
    <div class="empty-icon">🎮</div>
    <h3>Nothing found</h3>
    <p>Try a different search or filter.</p>
  </div>
</main>

<footer>
  <span class="footer-brand">Game<span>Stash</span></span>
  <span>Made by <strong style="color:var(--text2)">luke.j</strong></span>
</footer>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title-wrap">
        <span class="modal-title" id="modalTitle">—</span>
        <span id="modalBadge"></span>
      </div>
      <div class="modal-actions">
        <button class="btn-x" id="btnClose" title="Close (Esc)">✕</button>
      </div>
    </div>
    <div class="modal-game">
      <div class="game-loader" id="gameLoader">
        <div class="spin"></div>
        <span>Loading game…</span>
      </div>
      <iframe id="gameFrame" allow="fullscreen; pointer-lock" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-modals"></iframe>
    </div>
    <div class="modal-below">
      <div class="modal-info">
        <div class="info-col">
          <div class="info-label">About</div>
          <div class="game-desc" id="gameDesc">—</div>
        </div>
        
        <div class="info-col" style="display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 24px;">
          <div class="controls-dropdown">
            <button id="controlsBtn" class="controls-btn">🎮 View Controls ▼</button>
            <div id="controlsContent" class="controls-content">
               <div class="info-label" style="margin-bottom: 8px;">Controls</div>
               <div class="ctrl-list" id="ctrlList"></div>
            </div>
          </div>
        </div>
        
      </div>
    </div>
  </div>
</div>

<script>
// ── DROPDOWN BEHAVIOR ──
document.getElementById('controlsBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  document.getElementById('controlsContent').classList.toggle('show');
});
document.addEventListener('click', function(e) {
  if (!e.target.closest('.controls-dropdown')) {
    const dropdown = document.getElementById('controlsContent');
    if (dropdown && dropdown.classList.contains('show')) dropdown.classList.remove('show');
  }
});

// ── CONTROLS PER PLATFORM ────────────────────────────────────────────────────
var CTRL_DISPLAY = {
  NES: [
    ["D-Pad", "WASD / Arrows"], ["A Button", "K"], ["B Button", "J"], 
    ["Start", "Enter"], ["Select", "Shift"], ["Save State", "1"], ["Load State", "2"]
  ],
  SNES: [
    ["D-Pad", "WASD / Arrows"], ["A Button", "K"], ["B Button", "J"], 
    ["X Button", "I"], ["Y Button", "U"], ["Start", "Enter"], ["Select", "Shift"],
    ["L Bumper", "Q"], ["R Bumper", "E"], ["Save State", "1"], ["Load State", "2"]
  ],
  N64: [
    ["Joystick", "WASD"], ["A Button", "K"], ["B Button", "J"], 
    ["Start", "Enter"], ["Z Trigger", "Space"], ["L Bumper", "Q"], ["R Bumper", "E"], 
    ["C-Buttons", "Arrow Keys"], ["Save State", "1"], ["Load State", "2"]
  ],
  PS1: [
    ["D-Pad", "WASD / Arrows"], ["Cross ✕", "K"], ["Circle ○", "L"], 
    ["Square □", "J"], ["Triangle △", "I"], ["Start", "Enter"], ["Select", "Shift"], 
    ["L1/L2", "Q / 1"], ["R1/R2", "E / 3"], ["Save State", "1"], ["Load State", "2"]
  ],
  SEGA: [
    ["D-Pad", "WASD / Arrows"], ["A Button", "J"], ["B Button", "K"], ["C Button", "L"],
    ["Start", "Enter"], ["Save State", "1"], ["Load State", "2"]
  ],
  NDS: [
    ["D-Pad", "WASD / Arrows"], ["A Button", "K"], ["B Button", "J"],
    ["X Button", "I"], ["Y Button", "U"], ["L Bumper", "Q"], ["R Bumper", "E"], 
    ["Start", "Enter"], ["Select", "Shift"], ["Save State", "1"], ["Load State", "2"]
  ],
  GBA: [
    ["D-Pad", "WASD / Arrows"], ["A Button", "K"], ["B Button", "J"],
    ["L Bumper", "Q"], ["R Bumper", "E"], ["Start", "Enter"], ["Select", "Shift"],
    ["Save State", "1"], ["Load State", "2"]
  ]
};

var CTRL_BASE_LS = {
  'p1b4keyboard':'w', 'p1b5keyboard':'s', 'p1b6keyboard':'a', 'p1b7keyboard':'d', // D-Pad
  'p1b2keyboard':'shift', // Select
  'p1b3keyboard':'enter', // Start
  'p1a0-keyboard':'a', 'p1a0+keyboard':'d', 'p1a1-keyboard':'w', 'p1a1+keyboard':'s' // L-Stick
};

var CTRL_EXTRA_LS = {
  NES: { 'p1b8keyboard':'k', 'p1b0keyboard':'j' },
  SNES: { 'p1b8keyboard':'k', 'p1b0keyboard':'j', 'p1b9keyboard':'i', 'p1b1keyboard':'u', 'p1b10keyboard':'q', 'p1b11keyboard':'e' },
  N64: { 'p1b8keyboard':'k', 'p1b0keyboard':'j', 'p1b12keyboard':' ', 'p1b10keyboard':'q', 'p1b11keyboard':'e', 'p1a2-keyboard':'arrowleft', 'p1a2+keyboard':'arrowright', 'p1a3-keyboard':'arrowup', 'p1a3+keyboard':'arrowdown' },
  PS1: { 'p1b0keyboard':'k', 'p1b8keyboard':'l', 'p1b1keyboard':'j', 'p1b9keyboard':'i', 'p1b10keyboard':'q', 'p1b11keyboard':'e', 'p1b12keyboard':'1', 'p1b13keyboard':'3' },
  SEGA: { 'p1b8keyboard':'j', 'p1b0keyboard':'k', 'p1b11keyboard':'l' },
  NDS: { 'p1b8keyboard':'k', 'p1b0keyboard':'j', 'p1b9keyboard':'i', 'p1b1keyboard':'u', 'p1b10keyboard':'q', 'p1b11keyboard':'e' },
  GBA: { 'p1b8keyboard':'k', 'p1b0keyboard':'j', 'p1b10keyboard':'q', 'p1b11keyboard':'e' }
};

function buildCtrlLS(platform) {
  var extra = CTRL_EXTRA_LS[platform] || CTRL_EXTRA_LS['SNES'];
  return Object.assign({}, CTRL_BASE_LS, extra);
}

// ── GAME DATA ────────────────────────────────────────────────────────────────
// HOW TO ADD GAMES:
// Make sure "type" is "merge", and set "url" to "games/YOUR_ROM_FILE_NAME.ext"
var GAMES = [
  {
    id: "mario-64",
    title: "Super Mario 64",
    platform: "N64",
    cover: "https://upload.wikimedia.org/wikipedia/en/6/6a/Super_Mario_64_box_cover.jpg",
    desc: "The groundbreaking 3D platformer.",
    type: "merge",
    core: "n64",
    name: "Super Mario 64",
    url: "games/mario64.z64" 
  }
  // PASTE THE REST OF YOUR GAMES HERE
];

// ── CRASH-FREE INITIALIZATION ────────────────────────────────────────────────
var adminGames = [], removedGames = [], gameEdits = {};

try {
  adminGames = JSON.parse(localStorage.getItem('adminGames') || '[]');
  removedGames = JSON.parse(localStorage.getItem('removedGames') || '[]');
  gameEdits = JSON.parse(localStorage.getItem('gameEdits') || '{}');
} catch(e) {
  console.error("Storage parse error, resetting cache views:", e);
}

var combinedGames = [...GAMES];
adminGames.forEach(function(ag){
  ag._isAdded = true;
  combinedGames.push(ag);
});

var activeGames = [];
combinedGames.forEach(function(g){
  if(removedGames.includes(g.id)) return;
  if(gameEdits[g.id]) {
    g = Object.assign({}, g, gameEdits[g.id]);
  }
  activeGames.push(g);
});

activeGames.sort(function(a,b){ return a.title.localeCompare(b.title); });

var query = '', filterP = 'all';

function render() {
  var grid = document.getElementById('grid');
  var emp = document.getElementById('empty');
  grid.innerHTML = '';
  
  var res = activeGames.filter(function(g){
    var m1 = filterP === 'all' || g.platform === filterP;
    var m2 = g.title.toLowerCase().includes(query.toLowerCase());
    return m1 && m2;
  });

  document.getElementById('gameCount').textContent = res.length + ' games';
  document.getElementById('resultsText').textContent = query ? 'Search results for "'+query+'"' : (filterP==='all'?'All games':filterP+' games');

  if(res.length === 0){
    grid.style.display = 'none';
    emp.classList.add('show');
  } else {
    grid.style.display = 'grid';
    emp.classList.remove('show');
    res.forEach(function(g){
      var d = document.createElement('div');
      d.className = 'card';
      var cls = 'b-' + (g.platform||'').toLowerCase();
      
      d.innerHTML = `
        <div class="card-img-wrap">
          <div class="card-fallback">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M21 6H3a2 2 0 00-2 2v8a2 2 0 002 2h18a2 2 0 002-2V8a2 2 0 00-2-2zM8 13H6v2H4v-2H2v-2h2V9h2v2h2v2zm4.5 1.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S15.67 8.5 16.5 8.5 18 9.17 18 10s-.67 1.5-1.5 1.5z" fill="currentColor"/></svg>
            <span>No Cover</span>
          </div>
          <img class="card-img" src="${g.cover||''}" loading="lazy" onerror="this.style.display='none';this.previousElementSibling.style.display='flex'">
          <div class="card-play">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="card-body">
          <div class="card-title">${g.title}</div>
          <div class="card-footer"><span class="badge ${cls}">${g.platform}</span></div>
        </div>
      `;
      d.addEventListener('click', function(){ openModal(g); });
      grid.appendChild(d);
    });
  }
}

// ── GAME LAUNCHING ──
function generateEmuHtml(g) {
  var b64Config = btoa(JSON.stringify(buildCtrlLS(g.platform)));
  return `
  <!DOCTYPE html><html><head>
  <style>body,html{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}</style>
  <script>
    try {
      var map = JSON.parse(atob('${b64Config}'));
      for(var k in map) localStorage.setItem(k, map[k]);
    } catch(e){}
  <\/script>
  </head><body>
  <div style="width:100%;height:100%;max-width:100%">
    <div id="game"></div>
  </div>
  <script>
    EJS_player = '#game';
    EJS_core = '${g.core}';
    EJS_gameName = '${g.name}';
    EJS_color = '#2563eb';
    EJS_startOnLoaded = true;
    EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/';
    ${g.type==='merge' ? `EJS_gameUrl = '${g.url}';` : ''}
  <\/script>
  <script src="https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/loader.js"><\/script>
  </body></html>`;
}

var currentGame = null, blobUrl = null;

function openModal(g) {
  currentGame = g;
  document.getElementById('modalTitle').textContent = g.title;
  var b = document.getElementById('modalBadge');
  b.className = 'badge b-' + (g.platform||'').toLowerCase();
  b.textContent = g.platform;
  document.getElementById('gameDesc').textContent = g.desc || 'No description provided.';
  
  // Set Controls for Dropdown
  var cl = document.getElementById('ctrlList');
  cl.innerHTML = '';
  var map = CTRL_DISPLAY[g.platform] || CTRL_DISPLAY['GBA'];
  map.forEach(function(c){
    cl.innerHTML += `<div class="ctrl-row"><span class="ctrl-action">${c[0]}</span><span class="ctrl-key">${c[1]}</span></div>`;
  });

  document.getElementById('modalBg').classList.add('open');
  document.body.style.overflow = 'hidden';

  var frame = document.getElementById('gameFrame');
  var loader = document.getElementById('gameLoader');
  loader.style.display = 'flex';
  frame.style.opacity = '0';
  document.getElementById('controlsContent').classList.remove('show');

  if (g.type === 'merge') {
    try {
      blobUrl = URL.createObjectURL(new Blob([generateEmuHtml(g)], {type:'text/html'}));
      frame.onload = function(){ loader.style.display='none'; frame.style.opacity='1'; };
      frame.src = blobUrl;
    } catch(e) {
      console.error(e);
      loader.innerHTML = '<span style="color:#f87171">Failed to load game.</span>';
    }
  } else if (g.file) {
    loader.style.display = 'none';
    frame.style.opacity  = '1';
    frame.src = g.file;
  }
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
  document.body.style.overflow = '';
  var frame = document.getElementById('gameFrame');
  setTimeout(function(){
    frame.src = 'about:blank';
    if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
  }, 200);
  currentGame = null;
}

document.getElementById('btnClose').addEventListener('click', closeModal);
document.getElementById('modalBg').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

// ── FILTERS / SEARCH ─────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', function(e){ query=e.target.value; render(); });
document.querySelectorAll('.chip').forEach(function(c){
  c.addEventListener('click', function(){
    document.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('on'); });
    c.classList.add('on');
    filterP = c.getAttribute('data-p');
    render();
  });
});

render();
</script>
