<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameStash — Play Classic Games Free</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#2563eb;--blue-d:#1d4ed8;--blue-l:#eff6ff;--blue-m:#bfdbfe;
  --text:#111827;--text2:#374151;--text3:#6b7280;
  --border:#e5e7eb;--bg:#f9fafb;--white:#fff;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow-lg:0 12px 40px rgba(0,0,0,.15);
  --radius:12px;
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

/* HEADER */
.header{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.header-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0}
.logo-mark{width:34px;height:34px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:18px;height:18px;fill:white}
.logo-name{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700;color:var(--text);letter-spacing:-.3px}
.logo-name span{color:var(--blue)}
.search-wrap{flex:1;max-width:400px;position:relative}
.search-wrap input{width:100%;padding:9px 14px 9px 38px;border:1.5px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:.875rem;color:var(--text);background:var(--bg);outline:none;transition:.15s}
.search-wrap input:focus{border-color:var(--blue);background:var(--white);box-shadow:0 0 0 3px #dbeafe}
.search-wrap input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.header-end{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn-admin{padding:7px 14px;border:1.5px solid var(--border);border-radius:7px;background:var(--white);color:var(--text2);font-family:'Inter',sans-serif;font-size:.8rem;font-weight:500;cursor:pointer;text-decoration:none;transition:.15s}
.btn-admin:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.game-count{font-size:.8rem;color:var(--text3);font-weight:500;white-space:nowrap}

/* FILTERS */
.filters-bar{background:var(--white);border-bottom:1px solid var(--border);padding:12px 24px}
.filters-inner{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filter-label{font-size:.75rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-right:4px}
.chip{padding:5px 13px;border-radius:99px;border:1.5px solid var(--border);background:var(--white);color:var(--text2);font-size:.8rem;font-weight:500;cursor:pointer;transition:.15s;user-select:none}
.chip:hover{border-color:#93c5fd;color:var(--blue);background:var(--blue-l)}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--white)}

/* MAIN */
main{max-width:1200px;margin:0 auto;padding:28px 24px 64px}
.section-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.section-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;color:var(--text)}
.results-text{font-size:.8rem;color:var(--text3)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:16px}

/* CARD — square 1:1 covers */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.18s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--blue-m)}
.card-img-wrap{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--blue-l)}
.card-img{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}
.card:hover .card-img{transform:scale(1.05)}
.card-fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--blue);font-size:.8rem;font-weight:600;text-align:center;padding:12px}
.card-fallback-icon{font-size:2rem}
.card-hover-overlay{position:absolute;inset:0;background:rgba(17,24,39,.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:.18s}
.card-hover-overlay svg{width:44px;height:44px;fill:white;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.card:hover .card-hover-overlay{opacity:1}
.card-body{padding:9px 11px 9px}
.card-title{font-family:'Space Grotesk',sans-serif;font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:7px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-footer{display:flex;align-items:center}
.badge{font-size:.67rem;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.2px;text-transform:uppercase}
.b-ps1{background:#e0e7ff;color:#4338ca}
.b-n64{background:#dcfce7;color:#15803d}
.b-nds{background:#fef3c7;color:#b45309}
.b-snes{background:#fce7f3;color:#be185d}
.b-nes{background:#f3e8ff;color:#7c3aed}
.b-sega{background:#e0f2fe;color:#0369a1}
.b-other{background:#f3f4f6;color:#374151}

/* EMPTY */
.empty{text-align:center;padding:80px 20px;display:none}
.empty.show{display:block}
.empty-icon{font-size:2.5rem;margin-bottom:12px}
.empty h3{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;color:var(--text);margin-bottom:6px}
.empty p{font-size:.875rem;color:var(--text3)}

/* GAME POPUP MODAL */
.modal-bg{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--white);border-radius:18px;width:100%;max-width:920px;height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.35)}

/* Modal header */
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-title-wrap{display:flex;align-items:center;gap:10px}
.modal-title{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:700;color:var(--text)}
.modal-actions{display:flex;align-items:center;gap:8px}
.btn-x{width:32px;height:32px;border-radius:7px;border:1.5px solid var(--border);background:var(--white);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.95rem;transition:.15s;flex-shrink:0}
.btn-x:hover{background:var(--bg)}

/* Game iframe area */
.modal-game{position:relative;background:#000;flex-shrink:0;min-height:0}
.modal-game iframe{width:100%;height:360px;border:none;display:block}
.game-loader{position:absolute;inset:0;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:rgba(255,255,255,.65);font-size:.875rem;z-index:2}
.spin{width:32px;height:32px;border:2.5px solid rgba(255,255,255,.1);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Info section */
.modal-below{flex:1;min-height:0;overflow-y:scroll;-webkit-overflow-scrolling:touch;display:block}.modal-info{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--border)}
.info-col{padding:18px 20px}
.info-col:first-child{border-right:1px solid var(--border)}
.info-label{font-family:'Space Grotesk',sans-serif;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:10px}
.game-desc{font-size:.855rem;color:var(--text2);line-height:1.65}
.ctrl-list{display:grid;grid-template-columns:1fr 1fr;gap:0}
.ctrl-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f3f4f6}
.ctrl-row:last-child{border-bottom:none}
.ctrl-action{font-size:.75rem;color:var(--text3)}
.ctrl-key{font-size:.72rem;font-weight:600;color:var(--text);background:var(--bg);border:1.5px solid var(--border);border-radius:4px;padding:1px 6px;font-family:monospace;white-space:nowrap}

/* FULLSCREEN OVERLAY */
.fs-overlay{position:fixed;inset:0;z-index:1000;background:#000;display:none;flex-direction:column}
.fs-overlay.open{display:flex}
.fs-bar{height:46px;background:#0f172a;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.07)}
.fs-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.9rem;color:white;display:flex;align-items:center;gap:8px}
.fs-plat{font-size:.7rem;color:rgba(255,255,255,.38);font-family:'Inter',sans-serif}
.fs-x{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.8);width:30px;height:30px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;transition:.15s}
.fs-x:hover{background:rgba(255,255,255,.18);color:white}
.fs-body{flex:1;position:relative}
.fs-body iframe{width:100%;height:100%;border:none;display:block}

/* FOOTER */
footer{border-top:1px solid var(--border);background:var(--white);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;font-size:.8rem;color:var(--text3)}
.footer-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--text);font-size:.85rem}
.footer-brand span{color:var(--blue)}

/* RESPONSIVE */
@media(max-width:680px){
  .header-inner{padding:0 14px;gap:10px}
  .filters-bar{padding:10px 14px}
  main{padding:20px 14px 48px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .game-count{display:none}
  .modal{max-height:96vh;border-radius:12px}
  .modal-game iframe{height:240px}
  .modal-info{grid-template-columns:1fr}
  .info-col:first-child{border-right:none;border-bottom:1px solid var(--border)}
  .ctrl-list{grid-template-columns:1fr}
}
</style>
</head>

<footer>

<!-- GAME POPUP MODAL -->
<div class="modal-bg" id="modalBg">

    <div class="modal-game">

        <span id="loaderText">Loading game…</span>

      </iframe>
    </div>
    <div class="modal-below"><div class="modal-info">
      <div class="info-col">
        <div class="info-label">About</div>
        <div class="game-desc" id="gameDesc">—</div>
      </div>
      <div class="info-col">
        <div class="info-label">Controls</div>
        <div class="ctrl-list" id="ctrlList"></div>
      </div>
    </div></div>
  </div>
</div>

<!-- FULLSCREEN OVERLAY -->
<div class="fs-overlay" id="fsOverlay">
  <div class="fs-bar">
    <div class="fs-title" id="fsTitle">Game <span class="fs-plat" id="fsPlat"></span></div>
    <button class="fs-x" id="fsClose">✕</button>
  </div>
  <div class="fs-body">
    <iframe id="fsFrame"
      allow="fullscreen; pointer-lock"
      sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-modals">
    </iframe>
  </div>
</div>

var BADGE_CLASS={PS1:"b-ps1",N64:"b-n64",NDS:"b-nds",SNES:"b-snes",NES:"b-nes",SEGA:"b-sega"};

// STORAGE
function getDeleted(){return JSON.parse(localStorage.getItem('pv_deleted')||'[]');}
function getHidden(){return JSON.parse(localStorage.getItem('pv_hidden')||'[]');}
function getEdits(){return JSON.parse(localStorage.getItem('pv_edits')||'{}');}
function getAdminGames(){return JSON.parse(localStorage.getItem('pv_admin_games')||'[]');}
function getAllGames(){
  var del=getDeleted(),hid=getHidden(),edits=getEdits();
  var base=GAMES.filter(function(g){return !del.includes(g.id);}).map(function(g){
    var e=edits[g.id];return e?Object.assign({},g,e):g;
  }).filter(function(g){return !hid.includes(g.id);});
  var admin=getAdminGames().filter(function(g){return !hid.includes(g.id);});
  return base.concat(admin);
}

// RENDER GRID
var filter='all',query='';
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function render(){
  var all=getAllGames();
  var q=query.toLowerCase().trim();
  var list=all.filter(function(g){
    return (filter==='all'||g.platform===filter)&&(!q||g.title.toLowerCase().includes(q)||g.platform.toLowerCase().includes(q));
  });
  document.getElementById('gameCount').textContent=all.length+' games';
  document.getElementById('resultsText').textContent=list.length===all.length?all.length+' games':list.length+' of '+all.length+' games';
  var grid=document.getElementById('grid');
  var empty=document.getElementById('empty');
  grid.innerHTML='';
  if(!list.length){empty.classList.add('show');return;}
  empty.classList.remove('show');
  list.forEach(function(g){
    var pl=PLAT_LABEL[g.platform]||g.platform;
    var bc=BADGE_CLASS[g.platform]||'b-other';
    var div=document.createElement('div');
    div.className='card';
    div.innerHTML='<div class="card-img-wrap">'
      +'<img class="card-img" src="'+esc(g.cover)+'" alt="'+esc(g.title)+'" referrerpolicy="no-referrer" loading="lazy"'
      +' onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
      +'<div class="card-fallback"><span class="card-fallback-icon">🎮</span><span>'+esc(g.title)+'</span></div>'
      +'<div class="card-hover-overlay"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>'
      +'</div>'
      +'<div class="card-body">'
      +'<div class="card-title" title="'+esc(g.title)+'">'+esc(g.title)+'</div>'
      +'<div class="card-footer"><span class="badge '+bc+'">'+esc(pl)+'</span></div>'
      +'</div>';
    div.addEventListener('click',function(){openModal(g);});
    grid.appendChild(div);
  });
}

  if(g.type==='merge'){

// MODAL
var currentGame=null, blobUrl=null;

function buildCtrlHtml(platform){
  var ctrls=CONTROLS[platform]||CONTROLS.SNES;
  var html='';
  ctrls.forEach(function(c){
    html+='<div class="ctrl-row"><span class="ctrl-action">'+esc(c[0])+'</span><span class="ctrl-key">'+esc(c[1])+'</span></div>';
  });
  return html;
}

function openModal(g){
  currentGame=g;
  var pl=PLAT_LABEL[g.platform]||g.platform;
  var bc=BADGE_CLASS[g.platform]||'b-other';
  document.getElementById('modalTitle').textContent=g.title;
  document.getElementById('modalBadge').innerHTML='<span class="badge '+bc+'" style="font-size:.68rem">'+esc(pl)+'</span>';
  document.getElementById('gameDesc').textContent=g.desc||'A classic game.';
  document.getElementById('ctrlList').innerHTML=buildCtrlHtml(g.platform);

  var frame=document.getElementById('gameFrame');
  var loader=document.getElementById('gameLoader');
  document.getElementById('loaderText').textContent='Loading game…';
  loader.style.display='flex';
  frame.style.opacity='0';
  frame.src='about:blank';
  document.getElementById('modalBg').classList.add('open');
  document.body.style.overflow='hidden';
  loadIntoFrame(frame,g,loader);
}

function loadIntoFrame(frame,g,loaderEl){
  if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=null;}
  var html;
  if(g.type==='merge'||g.type==='direct'){
    html=buildGameHtml(g);
  } else if(g.file){
    if(loaderEl)loaderEl.style.display='none';
    frame.style.opacity='1';
    frame.src=g.file;
    return;
  }
  try{
    blobUrl=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    frame.onload=function(){if(loaderEl)loaderEl.style.display='none';frame.style.opacity='1';};
    frame.src=blobUrl;
  }catch(e){
    console.error(e);
    if(loaderEl)loaderEl.innerHTML='<span style="color:#f87171">Failed to load game.</span>';
  }
}

function closeModal(){
  document.getElementById('modalBg').classList.remove('open');
  document.body.style.overflow='';
  var frame=document.getElementById('gameFrame');
  setTimeout(function(){
    frame.src='about:blank';
    if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=null;}
  },200);
  currentGame=null;
}

// Full screen handled by emulator's built-in button

document.getElementById('fsClose').addEventListener('click',function(){
  var fsFrame=document.getElementById('fsFrame');
  document.getElementById('fsOverlay').classList.remove('open');
  fsFrame.src='about:blank';
  if(fsFrame._burl){URL.revokeObjectURL(fsFrame._burl);fsFrame._burl=null;}
});

document.getElementById('btnClose').addEventListener('click',closeModal);
document.getElementById('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(document.getElementById('fsOverlay').classList.contains('open'))document.getElementById('fsClose').click();
  else closeModal();
});

// Filters
document.getElementById('searchInput').addEventListener('input',function(e){query=e.target.value;render();});
document.querySelectorAll('.chip').forEach(function(c){
  c.addEventListener('click',function(){
    document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});
    c.classList.add('on');filter=c.dataset.p;render();
  });
});

render();
