<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
<script src="diag.js"></script>
<script src="ejs-boot.js"></script><title>Super Mario 64</title>
<style>
  body,html{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
  #game{width:100%;height:100%}
  #status{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none}
  #status span{font-family:monospace;font-size:13px;letter-spacing:.2em}
</style>
</head>
<body>
<div id="game"></div>
<div id="status">
  <span style="color:#0ff">LOADING…</span>
  <span id="err" style="display:none;color:#f55">Emulator failed — try refreshing</span>
</div>
<script>
  EJS_player="#game";EJS_core="parallel_n64";EJS_color="#0064ff";EJS_startOnLoaded=true;
  EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";
  EJS_gameUrl="https://cdn.jsdelivr.net/gh/bubbls/clsm64@139e09e38eb3e7783095eee30fdf75b18ee59e02/Super%20Mario%2064%20(USA).zip";
  EJS_defaultOptions={vsync:"disabled"};
  if(window.__diagProbe){window.__diag("game page loaded");window.__diagProbe("emulator core",EJS_pathtodata+"loader.js");window.__diagProbe("ROM",EJS_gameUrl);}
  var clearStatus=function(){var s=document.getElementById('status');if(s)s.remove();};
  EJS_ready=clearStatus;EJS_onGameStart=clearStatus;
</script>
<script>bootEmulator(function(){var st=document.getElementById('status');if(st){st.querySelector('span').style.display='none';document.getElementById('err').style.display='block';}});</script>
</body>
</html>
