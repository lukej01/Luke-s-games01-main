<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
<script src="../coi-serviceworker.js"></script>
  <title>Zelda: Ocarina of Time</title>
  <script>
    window.gameconfig = {
      name: "Legend of Zelda, The - Ocarina of Time (USA)",
      url: "https://cdn.jsdelivr.net/gh/bubbls/ugss@ffa46738ce21236742f4a44db08d87160fed6c7d/ocarinaoftime/Legend%20of%20Zelda%2C%20The%20-%20Ocarina%20of%20Time%20(USA).n64",
      core: "parallel_n64",
      min: 1,
      max: 2,
    };
  </script>
  <script>
    function mergeFiles(fileParts, cb) {
      return new Promise((resolve, reject) => {
        let buffers = [];
        function fetchPart(index) {
          if (index >= fileParts.length) {
            resolve(URL.createObjectURL(new Blob(buffers)));
            return;
          }
          fetch(fileParts[index])
            .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
            .then(data => { buffers.push(data); fetchPart(index + 1); })
            .catch(reject);
          cb(index);
        }
        fetchPart(0);
      });
    }
    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
      return parts;
    }
  </script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #121212; color: white; font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; }
    #game-container { text-align: center; width: 100%; height: 100%; }
    #loading-progress { font-size: 18px; margin-top: 20px; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 8px; display: inline-block; }
    #error-msg { display: none; color: #ff6b6b; font-size: 16px; margin-top: 20px; }
  </style>
</head>
<body>
<div id="game-container">
    <div id="game"></div>
    <div id="loading-progress">Loading: 0/0</div>
    <div id="first-time">First-time loading may take longer…</div>
    <div id="error-msg"></div>
  </div>
  <script>
    var parts = getParts(window.gameconfig.url, window.gameconfig.min, window.gameconfig.max);
    var totalParts = parts.length;
    function updateProgress(i) {
      var el = document.getElementById("loading-progress");
      if (el) el.textContent = "Loading: " + i + "/" + totalParts;
    }
    Promise.all([mergeFiles(parts, updateProgress)]).then(([gameUrl]) => {
      var lp = document.getElementById("loading-progress"); if (lp) lp.remove();
      var ft = document.getElementById("first-time"); if (ft) ft.remove();
      EJS_player = "#game";
      EJS_core = window.gameconfig.core;
      EJS_gameName = window.gameconfig.name;
      EJS_color = "#0064ff";
      EJS_startOnLoaded = true;
      EJS_threads = typeof SharedArrayBuffer === "function";
      EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      EJS_gameUrl = gameUrl;
      EJS_defaultOptions = { vsync: "disabled" };
      var s = document.createElement("script");
      s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      document.body.appendChild(s);
    }).catch(err => {
      console.error(err);
      var e = document.getElementById("error-msg");
      e.textContent = "Error loading game. Check your connection and try refreshing.";
      e.style.display = "block";
      var lp = document.getElementById("loading-progress"); if (lp) lp.remove();
    });
  </script>
</body>
</html>
