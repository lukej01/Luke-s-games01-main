<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sonic the Hedgehog 2</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #0ff; font-family: monospace; font-size: 13px; letter-spacing: 0.25em; pointer-events: none; }
    #game { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="loading">LOADING…</div>
  <div id="game"></div>
  <script>
    window.addEventListener('load', function() {
      EJS_player = "#game";
      EJS_core = "segaMD";
      EJS_color = "#0064ff";
      EJS_startOnLoaded = true;
      EJS_pathtodata = "https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/";
      EJS_gameUrl = "https://cdn.jsdelivr.net/gh/a456pur/seraph@ae2fcc6d6a9cd051654fcc0519080db1f79cf2a7/games/sonicthehedgehog2/Sonic%20The%20Hedgehog%202%20(World).md";
      EJS_onGameStart = function() { var l = document.getElementById('loading'); if (l) l.remove(); };
      var s = document.createElement('script');
      s.src = "https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/loader.js";
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
