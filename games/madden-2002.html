<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Madden NFL 2002</title>
<style>
  body,html{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
  #game{width:100%;height:100%}
  #status{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none}
  #status span{font-family:monospace;font-size:13px;letter-spacing:.2em}
</style>
</head>
<body>
<script>
if(typeof SharedArrayBuffer==='undefined'&&'serviceWorker'in navigator)
  navigator.serviceWorker.register('/Luke-s-games01-main/coi-serviceworker.js',{scope:'/Luke-s-games01-main/'}).then(function(r){
    if(r.active){location.reload();return;}
    var s=r.installing||r.waiting;s&&s.addEventListener('statechange',function(e){if(e.target.state==='activated')location.reload();});
  });
</script>
<div id="game"></div>
<div id="status">
  <span style="color:#0ff">LOADING…</span>
  <span id="err" style="display:none;color:#f55">Emulator failed — try refreshing</span>
</div>
<script>
  EJS_player="#game";EJS_core="n64";EJS_color="#0064ff";EJS_startOnLoaded=true;
  EJS_pathtodata="https://cdn.jsdelivr.net/npm/emulatorjs/data/";
  EJS_gameUrl="https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@30884886205950003acc451da53cbb940cbda522/Madden%20NFL%202002%20(USA).zip";
  EJS_defaultOptions={vsync:"disabled"};
  EJS_onGameStart=function(){var s=document.getElementById('status');if(s)s.remove();};
</script>
<script src="https://cdn.jsdelivr.net/npm/emulatorjs/data/loader.js" onerror="document.getElementById('status').querySelector('span').style.display='none';document.getElementById('err').style.display='block'"></script>
</body>
</html>
