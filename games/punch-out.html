<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
<script src="diag.js?v=7"></script>
<script src="ejs-boot.js?v=4"></script><title>Mike Tyson's Punch-Out!!</title>
<style>
  body,html{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
  #game{position:relative;width:100%;height:100%}
  #status{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none}
  #status span{font-family:monospace;font-size:13px;letter-spacing:.2em}
    /* Pin EmulatorJS's own containers to #game. Its stylesheet sizes them with
       width/height:inherit, which collapses to zero when any ancestor's
       computed height resolves to auto; pinning removes that dependency.
       Menus and other EJS chrome are siblings, so only the game containers
       are targeted. */
    #game > .ejs_game, #game > .ejs_canvas_parent {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
    }
    #game canvas.ejs_canvas { width: 100%; height: 100%; }

</style>
</head>
<body>
<div id="game"></div>
<div id="status">
  <span style="color:#0ff">LOADING…</span>
  <span id="err" style="display:none;color:#f55">Emulator failed — try refreshing</span>
</div>
<script>
  EJS_player="#game";EJS_core="nes";EJS_color="#0064ff";EJS_startOnLoaded=true;
  EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";
  EJS_gameUrl="https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@7f176dd47e40f0e0b68e704654d83d8fb69eabdc/Mike%20Tyson's%20Punch-Out!!%20(Japan%2C%20USA)%20(En).zip";
  if(window.__diagProbe){window.__diag("game page loaded");window.__diagProbe("emulator core",EJS_pathtodata+"loader.js");window.__diagProbe("ROM",EJS_gameUrl);}
  var clearStatus=function(){var s=document.getElementById('status');if(s)s.remove();};
  EJS_ready=clearStatus;EJS_onGameStart=clearStatus;
</script>
<script>bootEmulator(function(){var st=document.getElementById('status');if(st){st.querySelector('span').style.display='none';document.getElementById('err').style.display='block';}});</script>
</body>
</html>
