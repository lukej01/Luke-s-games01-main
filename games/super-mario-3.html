<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Super Mario Bros. 3</title>
<style>
  body,html{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
  #game{width:100%;height:100%}
  #status{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none}
  #status span{font-family:monospace;font-size:13px;letter-spacing:.2em}
</style>
</head>
<body>
<div id="game"></div>
<div id="status">
  <span style="color:#0ff">LOADING…</span>
  <span id="err" style="display:none;color:#f55">Emulator failed — try refreshing</span>
</div>
<script>
  EJS_player="#game";EJS_core="nes";EJS_color="#0064ff";EJS_startOnLoaded=true;
  EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";
  EJS_gameUrl="https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@a98e2e20cae75fa14dd7450a1047348ccf0786d6/Super%20Mario%20Bros.%203%20(USA).zip";
  var clearStatus=function(){var s=document.getElementById('status');if(s)s.remove();};
  EJS_ready=clearStatus;EJS_onGameStart=clearStatus;
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js" onerror="document.getElementById('status').querySelector('span').style.display='none';document.getElementById('err').style.display='block'"></script>
</body>
</html>
