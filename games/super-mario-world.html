<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Super Mario World</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body { overflow: hidden; background: #000; margin: 0; padding: 0; color: #000; }
    #startButton {
      display: block; width: 160px; height: 40px;
      background-color: #4caf50; color: white;
      text-align: center; font-size: 16px;
      margin: 40px auto; padding: 10px 20px;
      border: none; border-radius: 8px; cursor: pointer;
      font-family: 'Press Start 2P', cursive;
      box-shadow: 0 0 10px 2px #000;
    }
    #startButton:hover { background-color: #43a047; }
    #game { display: none; }
    #error-msg { display: none; color: #ff6b6b; font-size: 14px; text-align: center; margin: 20px auto; max-width: 400px; font-family: Arial, sans-serif; }
  </style>
</head>
<body>
  <div style="width: 100vw; height: 100vh; max-width: 100%;">
    <div id="game"></div>
    <button id="startButton">PLAY</button>
    <div id="error-msg"></div>
  </div>
  <script>
    document.getElementById("startButton").addEventListener("click", function() {
      document.getElementById("game").style.display = "block";
      document.getElementById("startButton").style.display = "none";
      EJS_player = "#game";
      EJS_core = "snes9x";
      EJS_color = "#000000";
      EJS_startOnLoaded = true;
      EJS_pathtodata = "https://cdn.jsdelivr.net/gh/genizy/emu@master/";
      // NOTE: The original UGS document had a copy-paste error for this game (Lego Star Wars HTML was used).
      // This URL uses the correct SNES core. If this URL does not load, visit the UGS document for the correct link:
      // https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/
      EJS_gameUrl = "https://cdn.jsdelivr.net/gh/nicowillis/retrogaming@main/roms/snes/Super%20Mario%20World%20(USA).sfc";
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js";
      s.onerror = function() {
        document.getElementById("game").style.display = "none";
        document.getElementById("error-msg").textContent = "Error loading emulator. Check your connection and try refreshing. If this persists, the game URL may need updating in Admin settings.";
        document.getElementById("error-msg").style.display = "block";
      };
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
