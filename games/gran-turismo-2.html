<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gran Turismo 2</title>
  <style>
    body, html {
      margin: 0; padding: 0;
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
    }
    #game-container { text-align: center; width: 100%; height: 100%; }
    #loading-progress {
      font-size: 18px; margin-top: 20px; padding: 10px;
      background: rgba(255,255,255,0.1); border-radius: 8px; display: inline-block;
    }
    #error-msg { display: none; color: #ff6b6b; font-size: 16px; margin-top: 20px; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="game"></div>
    <div id="loading-progress">Loading Simulation Disc...</div>
    <div id="error-msg"></div>
  </div>
  <script>
    var gameUrl = "https://myrient.erista.me/files/MAME/Software%20List%20CHDs%20(merged)/psx/gt2/gran%20turismo%202%20(usa)%20(simulation%20mode)%20(v1.2).chd";
    var prog = document.getElementById("loading-progress");
    var errEl = document.getElementById("error-msg");

    fetch(gameUrl)
      .then(function(r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        var total = parseInt(r.headers.get("content-length") || "0");
        if (!total || !r.body) return r.arrayBuffer();
        var reader = r.body.getReader();
        var received = 0;
        var chunks = [];
        function read() {
          return reader.read().then(function(x) {
            if (x.done) return new Blob(chunks).arrayBuffer();
            chunks.push(x.value);
            received += x.value.length;
            if (prog) prog.textContent = "Loading: " + Math.round(received / total * 100) + "%";
            return read();
          });
        }
        return read();
      })
      .then(function(buf) {
        var blobUrl = URL.createObjectURL(new Blob([buf]));
        if (prog) prog.remove();
        EJS_player = "#game";
        EJS_core = "psx";
        EJS_gameName = "Gran Turismo 2 (USA) (Simulation Mode)";
        EJS_color = "#0064ff";
        EJS_startOnLoaded = true;
        EJS_pathtodata = "https://cdn.jsdelivr.net/gh/genizy/emu@master/";
        EJS_gameUrl = blobUrl;
        EJS_biosUrl = "https://cdn.jsdelivr.net/gh/Abdess/retroarch_system@5f96368f6dbad5851cdb16a5041fefec4bdcd305/Sony%20-%20PlayStation/scph5501.bin";
        EJS_cheats = [
          ["All Cars Unlocked",   "800E9D14 FFFF", true],
          ["All Cars Unlocked 2", "800E9D16 FFFF", true],
          ["All Tracks Unlocked", "800CC0B8 FFFF", true],
          ["Max Credits Lo",      "800CC0A0 FFFF", true],
          ["Max Credits Hi",      "800CC0A2 000F", true]
        ];
        var script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js";
        document.body.appendChild(script);
      })
      .catch(function(error) {
        console.error(error);
        if (prog) prog.remove();
        errEl.textContent = "Error loading game. Check your connection and try refreshing.";
        errEl.style.display = "block";
      });
  </script>
</body>
</html>
