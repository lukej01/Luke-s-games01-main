<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gran Turismo 2</title>
  <style>
    body,html{margin:0;padding:0;display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;background:#121212;color:#fff;font-family:Arial,sans-serif}
    #game-container{text-align:center;width:100%;height:100%}
    #loading-progress{font-size:18px;margin-top:20px;padding:10px;
    background:rgba(255,255,255,.1);border-radius:8px;display:inline-block}
    #first-time{margin-top:8px;font-size:12px;color:rgba(255,255,255,.4)}
    #error-msg{display:none;color:#ff6b6b;font-size:16px;margin-top:20px}
  </style>
</head>
<body>
  <div id="game-container">
    <div id="game"></div>
    <div id="loading-progress">Loading: 0 / 24</div>
    <div id="first-time">First-time loading may take longer…</div>
    <div id="error-msg"></div>
  </div>
  <script>
    var CONFIG = {
      name: "Gran Turismo 2 (USA) (Arcade Mode)",
      url:  "https://cdn.jsdelivr.net/gh/bubbls/ugss@943907cd0e3f7f47ade82d0b0032eba262a89c93/gran%20turismo%202/Gran%20Turismo%202%20(USA)%20(Arcade%20Mode).chd",
      core: "psx",
      min:  1,
      max:  24,
      pathtodata: "https://cdn.jsdelivr.net/gh/genizy/emu@master/",
      bios: "https://cdn.jsdelivr.net/gh/Abdess/retroarch_system@5f96368f6dbad5851cdb16a5041fefec4bdcd305/Sony%20-%20PlayStation/scph5501.bin"
    };

    function getParts(baseUrl, min, max) {
      var parts = [], padLen = String(max).length;
      for (var i = min; i <= max; i++) {
        parts.push(baseUrl + ".part" + String(i).padStart(padLen, "0"));
      }
      return parts;
    }

    function mergeFiles(parts, onProgress) {
      return new Promise(function(resolve, reject) {
        var buffers = [];
        function next(i) {
          if (i >= parts.length) {
            resolve(URL.createObjectURL(new Blob(buffers)));
            return;
          }
          fetch(parts[i])
            .then(function(r) {
              if (!r.ok) throw new Error("HTTP " + r.status);
              return r.arrayBuffer();
            })
            .then(function(buf) {
              buffers.push(buf);
              onProgress(i + 1, parts.length);
              next(i + 1);
            })
            .catch(reject);
        }
        next(0);
      });
    }

    var parts = getParts(CONFIG.url, CONFIG.min, CONFIG.max);
    var prog  = document.getElementById("loading-progress");
    var ft    = document.getElementById("first-time");
    var errEl = document.getElementById("error-msg");

    mergeFiles(parts, function(loaded, total) {
      if (prog) prog.textContent = "Loading: " + loaded + " / " + total;
    })
    .then(function(gameUrl) {
      if (prog) prog.remove();
      if (ft)   ft.remove();

      // ── Core emulator config ─────────────────────────────────────────────
      EJS_player        = "#game";
      EJS_core          = CONFIG.core;
      EJS_gameName      = CONFIG.name;
      EJS_color         = "#2563eb";
      EJS_startOnLoaded = true;
      EJS_pathtodata    = CONFIG.pathtodata;
      EJS_gameUrl       = gameUrl;
      EJS_biosUrl       = CONFIG.bios;

      // ── Cheats: All Cars + All Tracks + Max Money ────────────────────────
      // Format expected by EmulatorJS: array of [description, code] pairs
      // Codes are GameShark (PSX) format: XXXXXXXX YYYY
      EJS_cheats = [
        ["All Cars Unlocked",    "800E9D14 FFFF"],
        ["All Cars Unlocked 2",  "800E9D16 FFFF"],
        ["All Tracks Unlocked",  "800CC0B8 FFFF"],
        ["Max Money (Lo)",       "800CC0A0 FFFF"],
        ["Max Money (Hi)",       "800CC0A2 000F"]
      ];

      // ── Load emulator ────────────────────────────────────────────────────
      var s = document.createElement("script");
      s.onerror = function() {
        errEl.textContent = "Failed to load emulator. Check your connection.";
        errEl.style.display = "block";
      };
      s.src = CONFIG.pathtodata + "loader.js";
      document.body.appendChild(s);
    })
    .catch(function(err) {
      console.error(err);
      if (prog) prog.remove();
      errEl.textContent = "Error loading game: " + err.message;
      errEl.style.display = "block";
    });
  </script>
</body>
</html>
