<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
<script src="diag.js?v=4"></script>
<script src="ejs-boot.js?v=2"></script>
  <title>Paper Mario</title>
  <script>
    window.gameconfig = {
      name: "Paper Mario (USA)",
      url: "https://cdn.jsdelivr.net/gh/bubbls/ugss@69e5df0bdfad91580779ec98ca18841e753145fd/Paper%20Mario%20(USA)%20(2)/Paper%20Mario%20(USA).z64",
      core: "parallel_n64",
      min: 1,
      max: 3,
    };
  </script>
  <script>
    function mergeFiles(fileParts, cb) {
      return new Promise((resolve, reject) => {
        let buffers = [];
        function fetchPart(index) {
          if (index >= fileParts.length) { resolve(URL.createObjectURL(new Blob(buffers))); return; }
          fetch(fileParts[index])
            .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.blob(); })
            .then(data => { buffers.push(data); cb(index + 1); fetchPart(index + 1); })
            .catch(reject);
        }
        cb(0);
        fetchPart(0);
      });
    }
    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
      return parts;
    }
  </script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #121212; color: white; font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; }
        #game-container { text-align: center; width: 100%; height: 100%; }
    #loading-progress { font-size: 18px; margin-top: 20px; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 8px; display: inline-block; }
    #error-msg { display: none; color: #ff6b6b; font-size: 16px; margin-top: 20px; }
    /* The emulator fills the frame; loading and error text float above it so a
       full-height #game cannot push them out of view during the download. */
    #game-container { position: relative; }
    #game { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; }
    #loading-progress, #first-time, #error-msg {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      margin: 0; z-index: 5;
    }
    #first-time { top: calc(50% + 42px); }
    #error-msg { z-index: 6; }
    /* Pin EmulatorJS's own containers to #game. Its stylesheet sizes them with
       width/height:inherit, which collapses to zero when any ancestor's
       computed height resolves to auto; pinning removes that dependency.
       Menus and other EJS chrome are siblings, so only the game containers
       are targeted. */
    #game > .ejs_game, #game > .ejs_canvas_parent {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
    }
    #game canvas.ejs_canvas { width: 100%; height: 100%; }


  </style>
</head>
<body>
<div id="game-container">
    <div id="game"></div>
    <div id="loading-progress">Loading: 0/0</div>
    <div id="first-time">First-time loading may take longer…</div>
    <div id="error-msg"></div>
  </div>
  <script>
    var parts = getParts(window.gameconfig.url, window.gameconfig.min, window.gameconfig.max);
    var totalParts = parts.length;
    if (window.__diagProbe) {
      window.__diag("game page loaded, " + totalParts + " parts to fetch");
      window.__diagProbe("emulator core", "https://cdn.emulatorjs.org/stable/data/loader.js");
      window.__diagProbe("ROM part 1", parts[0]);
    }
    function updateProgress(i) { var el = document.getElementById("loading-progress"); if (el) el.textContent = "Loading: " + i + "/" + totalParts; }
    Promise.all([mergeFiles(parts, updateProgress)]).then(([gameUrl]) => {
      var lp = document.getElementById("loading-progress"); if (lp) lp.remove();
      var ft = document.getElementById("first-time"); if (ft) ft.remove();
      EJS_player = "#game"; EJS_core = window.gameconfig.core; EJS_gameName = window.gameconfig.name;
      EJS_color = "#0064ff"; EJS_startOnLoaded = true;
      EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      EJS_gameUrl = gameUrl; EJS_defaultOptions = { vsync: "disabled" };
      bootEmulator(function () {
        var errEl = document.getElementById("error-msg");
        errEl.textContent = "Emulator failed to load. Check your connection and try refreshing.";
        errEl.style.display = "block";
      });
    }).catch(err => {
      console.error(err);
      var e = document.getElementById("error-msg"); e.textContent = "Error loading game. Check your connection and try refreshing."; e.style.display = "block";
      var lp = document.getElementById("loading-progress"); if (lp) lp.remove();
    });
  </script>
</body>
</html>
